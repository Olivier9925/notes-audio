name: NotesAudio
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  NotesAudioDomain:
    path: .
targets:
  NotesAudio:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NotesAudioDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.notesaudio.app
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Notes Audio utilise le microphone pour enregistrer vos notes."
    info:
      path: App/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Notes Audio utilise le microphone pour enregistrer vos notes."
        UIBackgroundModes:
          - audio
schemes:
  NotesAudio:
    build:
      targets:
        NotesAudio: all
