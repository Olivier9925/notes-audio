name: NotesAudio
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  NotesAudioDomain:
    path: .
targets:
  NotesAudio:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NotesAudioDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivier9925.ondo
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ondo utilise le microphone pour transcrire votre voix en direct."
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ondo
        NSMicrophoneUsageDescription: "Ondo utilise le microphone pour transcrire votre voix en direct."
        NSSpeechRecognitionUsageDescription: "Ondo utilise la reconnaissance vocale pour transcrire votre voix en direct."
schemes:
  NotesAudio:
    build:
      targets:
        NotesAudio: all
