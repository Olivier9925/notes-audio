name: iOS
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test domain
        run: swift test
      - name: Build simulator
        run: xcodebuild -project NotesAudio.xcodeproj -scheme NotesAudio -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
